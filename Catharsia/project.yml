name: Catharsia
options:
  bundleIdPrefix: com.catharsia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.54.1
targets:
  Catharsia:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.SignInWithApple:
          enabled: 1
    sources:
      - path: Sources/Catharsia
    resources:
      - path: Sources/Catharsia/Resources/CatharsiaRefresh.wav
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Config/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.catharsia.ios
            CFBundleURLSchemes:
              - com.catharsia.ios
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        SUPABASE_AUTH_REDIRECT_URL: "com.catharsia.ios://login-callback"
        KATHAR_TENANT_ID: "$(KATHAR_TENANT_ID)"
        KATHAR_MEDIA_BUCKET_ID: "$(KATHAR_MEDIA_BUCKET_ID)"
        NSCameraUsageDescription: "Catharsia uses the camera so authorized therapists and administrators can create educational posts."
        NSMicrophoneUsageDescription: "Catharsia uses the microphone when authorized therapists and administrators record video posts."
    configFiles:
      Debug: Config/Supabase.xcconfig
      Release: Config/Supabase.xcconfig
    settings:
      base:
        DEVELOPMENT_TEAM: NP2PB46J97
        CODE_SIGNING_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Catharsia.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.catharsia.ios
        PRODUCT_NAME: Catharsia
        INFOPLIST_KEY_CFBundleDisplayName: Catharsia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "Catharsia uses the camera so authorized therapists and administrators can create educational posts."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Catharsia uses the microphone when authorized therapists and administrators record video posts."
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
      config:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGNING_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
